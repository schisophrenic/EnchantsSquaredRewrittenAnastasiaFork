name: Build native enchantment test JAR

on:
  push:
    branches:
      - feature/native-enchants-valhalla-26-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven shaded plugin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build all Maven modules
        run: mvn -B -ntp -DskipTests -Dgpg.skip=true clean package
      - name: Stage EnchantsSquared test JAR
        run: |
          mkdir -p dist-test
          find target -maxdepth 1 -name '*.jar' -type f -ls
          cp target/EnchantsSquared_2.7.jar dist-test/EnchantsSquared_NativeEnchant_NG_Test.jar
      - name: Upload downloadable test plugin
        uses: actions/upload-artifact@v4
        with:
          name: EnchantsSquared-NativeEnchant-NG-Test
          path: dist-test/EnchantsSquared_NativeEnchant_NG_Test.jar
          if-no-files-found: error
          retention-days: 14
