name: Build Elite-Only Enchanted Books BETA

on:
  push:
    branches:
      - feature/elite-only-enchanted-books-26-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven shaded plugin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install official ValhallaTrinkets 2.1 as provided dependency
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          url = 'https://api.modrinth.com/v2/project/valhallatrinkets/version'
          headers = {'User-Agent': 'EnchantsSquared-Development/1.0 (github.com/schisophrenic/EnchantsSquaredRewrittenAnastasiaFork)'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              versions = json.load(response)
          release = next((v for v in versions if v['version_number'] == '2.1'), None)
          if release is None:
              raise RuntimeError('Official ValhallaTrinkets 2.1 release not found')
          asset = next((f for f in release['files'] if f.get('primary')), release['files'][0])
          with urllib.request.urlopen(urllib.request.Request(asset['url'], headers=headers), timeout=90) as response:
              data = response.read()
          expected = asset['hashes'].get('sha512')
          if expected and hashlib.sha512(data).hexdigest() != expected:
              raise RuntimeError('ValhallaTrinkets checksum mismatch')
          with open('valhallatrinkets-2.1.jar', 'wb') as target:
              target.write(data)
          print('Downloaded and verified official ValhallaTrinkets 2.1 (' + str(len(data)) + ' bytes)')
          PY
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile=valhallatrinkets-2.1.jar -DgroupId=me.athlaeos \
            -DartifactId=valhallatrinkets -Dversion=2.1 -Dpackaging=jar -DgeneratePom=true
      - name: Build all Maven modules
        run: |
          set -o pipefail
          mvn -B -ntp -DskipTests -Dgpg.skip=true clean package 2>&1 | tee priority-maven-build.log
      - name: Stage EnchantsSquared test JAR
        run: |
          mkdir -p dist-test
          ls -lh enchantssquared-dist/target/EnchantsSquared_2.7.jar
          test -s enchantssquared-dist/target/EnchantsSquared_2.7.jar
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -Fx 'plugin.yml'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -Fx 'paper-plugin.yml'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeEnchantmentBootstrap.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'ValhallaTierEnchantingListener.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeSummonerEnchantListener.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeSummonValhallaBridge.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeSimpleEnchantConfig.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeCustomEnchantActions.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeCapturedMobEggs.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -Fx 'config_custom_enchants.yml'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeEnchantmentEvolution.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'EnchantmentPriority.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'VanillaAttackPriorityListener.class'
          jar tf enchantssquared-dist/target/EnchantsSquared_2.7.jar | grep -F 'NativeEnchantLootListener.class'
          cp enchantssquared-dist/target/EnchantsSquared_2.7.jar dist-test/EnchantsSquared_Elite_Books_BETA.jar
      - name: Upload downloadable test plugin
        uses: actions/upload-artifact@v4
        with:
          name: EnchantsSquared-Elite-Books-BETA
          path: dist-test/EnchantsSquared_Elite_Books_BETA.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Maven diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EnchantsSquared-Priority-Build-Logs
          path: priority-maven-build.log
          if-no-files-found: ignore
          retention-days: 7
