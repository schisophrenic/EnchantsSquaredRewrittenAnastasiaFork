name: Publish EnchantsSquared BETA JAR (2026-11-16)
on:
  push:
    branches:
      - release/beta-2026-11-16
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install official ValhallaTrinkets 2.1 as provided dependency
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          url = 'https://api.modrinth.com/v2/project/valhallatrinkets/version'
          headers = {'User-Agent': 'EnchantsSquared-Development/1.0 (github.com/schisophrenic/EnchantsSquaredRewrittenAnastasiaFork)'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              versions = json.load(response)
          release = next((v for v in versions if v['version_number'] == '2.1'), None)
          if release is None:
              raise RuntimeError('Official ValhallaTrinkets 2.1 release not found')
          asset = next((f for f in release['files'] if f.get('primary')), release['files'][0])
          with urllib.request.urlopen(urllib.request.Request(asset['url'], headers=headers), timeout=90) as response:
              data = response.read()
          expected = asset['hashes'].get('sha512')
          if expected and hashlib.sha512(data).hexdigest() != expected:
              raise RuntimeError('ValhallaTrinkets checksum mismatch')
          with open('valhallatrinkets-2.1.jar', 'wb') as target:
              target.write(data)
          print('Downloaded and verified official ValhallaTrinkets 2.1 (' + str(len(data)) + ' bytes)')
          PY
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile=valhallatrinkets-2.1.jar -DgroupId=me.athlaeos \
            -DartifactId=valhallatrinkets -Dversion=2.1 -Dpackaging=jar -DgeneratePom=true
      - name: Build all Maven modules
        run: mvn -B -ntp -DskipTests -Dgpg.skip=true clean package
      - name: Verify native plugin and prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="enchantssquared-dist/target/EnchantsSquared_2.7.jar"
          test -s "$SOURCE"
          jar tf "$SOURCE" | grep -Fx 'paper-plugin.yml'
          jar tf "$SOURCE" | grep -F 'NativeEnchantmentBootstrap.class'
          jar tf "$SOURCE" | grep -F 'NativeLowQualityEquipmentLoot.class'
          mkdir -p dist
          cp "$SOURCE" dist/EnchantsSquared-2.7.0-BETA-20261116.jar
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub prerelease (never mark as stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.7.0-beta.20261116"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/EnchantsSquared-2.7.0-BETA-20261116.jar dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file BETA_RELEASE_NOTES.md --prerelease
          else
            gh release create "$TAG" dist/EnchantsSquared-2.7.0-BETA-20261116.jar dist/SHA256SUMS.txt \
              --title "EnchantsSquared 2.7 BETA — native enchants and ValhallaEquipment" \
              --notes-file BETA_RELEASE_NOTES.md --prerelease --target "$GITHUB_SHA"
          fi
      - name: Archive verified release asset
        uses: actions/upload-artifact@v4
        with:
          name: EnchantsSquared-BETA-20261116
          path: |
            dist/EnchantsSquared-2.7.0-BETA-20261116.jar
            dist/SHA256SUMS.txt
          if-no-files-found: error
