name: Verify EnchantsSquared integration build

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install bundled ValhallaTrinkets compile API
        run: >
          mvn --batch-mode --no-transfer-progress
          org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file
          -Dfile=enchantssquared-core/ValhallaTrinkets.jar
          -DgroupId=me.athlaeos
          -DartifactId=valhallatrinkets
          -Dversion=2.1
          -Dpackaging=jar
      - name: Compile and package multi-module plugin
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
