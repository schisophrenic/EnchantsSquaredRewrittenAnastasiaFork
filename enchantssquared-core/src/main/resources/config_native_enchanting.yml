# Native Paper registry ↔ ValhallaMMO Enchanting integration
#
# These enchants are actual Bukkit/Paper Enchantment instances. ValhallaMMO
# only reads a hard-coded set of vanilla IDs from skills/enchanting.yml, so
# EnchantsSquared explicitly registers the following formulas at onEnable.
# They may be overridden in plugins/ValhallaMMO/skills/enchanting.yml under
# quoted scalings."enchantssquared:lesser_sharpness" etc. No Valhalla jar edit.
#
# Normal registry max_level is V; ValhallaMMO amplification may produce VI+.
# Native tiers inherit the same original enchanting skill rating and vanilla
# scaling formula as Sharpness/Smite/Bane (not normalized NG band quality).
# NG/perks decide WHICH native tier a player can receive, not the amplified
# level. We preserve Valhalla's already-scaled vanilla roll, avoiding double
# amplification.
#
# 45 limits the scaling component, not the enchanted item's total level.
native_scalings_enabled: true
native_scalings:
  lesser_sharpness: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  lesser_smite: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  lesser_bane_of_arthropods: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  advanced_sharpness: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  advanced_smite: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  advanced_bane_of_arthropods: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  supreme_sharpness: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  supreme_smite: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  supreme_bane_of_arthropods: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45

  # Additional native enchant families. Normal maxima are V/II/I/IV,
  # but ValhallaMMO may amplify final item enchant levels above them.
  lesser_power: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  advanced_power: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  supreme_power: (2/100) * %rating% - 2,ADD_ON_DEFAULT,1,45
  lesser_punch: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,8
  advanced_punch: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,8
  supreme_punch: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,8
  lesser_flame: 0,ADD_ON_DEFAULT,0,1
  advanced_flame: 0,ADD_ON_DEFAULT,0,1
  supreme_flame: 0,ADD_ON_DEFAULT,0,1
  lesser_fire_aspect: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,8
  advanced_fire_aspect: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,8
  supreme_fire_aspect: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,8
  lesser_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  advanced_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  supreme_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  lesser_fire_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  advanced_fire_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  supreme_fire_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  lesser_blast_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  advanced_blast_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  supreme_blast_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  lesser_projectile_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  advanced_projectile_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  supreme_projectile_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  lesser_magic_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  advanced_magic_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  supreme_magic_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45
  magic_protection: (1/100) * %rating% - 1,ADD_ON_DEFAULT,1,45

