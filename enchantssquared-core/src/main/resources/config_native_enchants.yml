# Edit this file to declare NEW REAL Minecraft enchantments.
# Paper registers these enchantments DIRECTLY during Java plugin bootstrap.
# No datapack is written to your world. Restart after editing this file,
# because Minecraft's enchantment registry freezes before onEnable().
#
# Native registry entries are global. The enchantment table's tier replacements
# are PLAYER-SPECIFIC, based on their ValhallaMMO perks and enchanting quality.
#
# Java effect handlers (implemented by the plugin):
#   vanilla_sharpness: Java damage +0.5 * (level + 1) on melee hit
#   vanilla_smite: Java damage +2.5 * level ONLY vs undead
#   vanilla_bane_of_arthropods: +2.5 * level vs arthropods + Slowness IV
#   on_hit_potion: special effect with configured potion and chance
#   none: registry-only until you implement a Java handler
#
# More event handlers can be added without changing how enchantments are registered.
settings:
  # Existing EnchantsSquared PDC effects remain enabled independently.
  # Only this enchantments: section is registered as new native entries.
  maximum_bonus_enchantments: 1

enchantments:
  lesser_sharpness:
    enabled: true
    display_name: Lesser Sharpness
    supported_items:
      - "#minecraft:enchantable/weapon"
    slots: [mainhand]
    weight: 10
    max_level: 5
    min_cost_base: 5
    min_cost_per_level: 8
    max_cost_base: 30
    max_cost_per_level: 8
    anvil_cost: 2
    # Tiered enchantments must NEVER be independently rolled by the vanilla table.
    table_obtainable: false
    tradeable: false
    exclusive_set:
      - minecraft:sharpness
      - enchantssquared:advanced_sharpness
      - enchantssquared:supreme_sharpness
    effect:
      handler: vanilla_sharpness

  advanced_sharpness:
    enabled: true
    display_name: Advanced Sharpness
    supported_items:
      - "#minecraft:enchantable/weapon"
    slots: [mainhand]
    weight: 5
    max_level: 5
    min_cost_base: 15
    min_cost_per_level: 8
    max_cost_base: 40
    max_cost_per_level: 8
    anvil_cost: 4
    table_obtainable: false
    tradeable: false
    exclusive_set:
      - minecraft:sharpness
      - enchantssquared:lesser_sharpness
      - enchantssquared:supreme_sharpness
    effect:
      handler: vanilla_sharpness

  supreme_sharpness:
