# A family is selected from its vanilla enchant, using NG/perk/quality gates.
# The player must have enchanting_perk_sharpnesses for these offensive tiers.
#
# quality_at_first_level is the effective ENCHANTING_QUALITY threshold for
# UNLOCKING the stage, not a cap on the enchantment level.
# Once eligible, the native tier inherits ValhallaMMO's ALREADY-AMPLIFIED
# vanilla enchantment level (VI, VII, VIII and beyond). We do not scale twice.
# Native registry max_level=5 is just the normal enchantment maximum.
#
# Unlock thresholds: NG1 Lesser Q650; NG2 Lesser Q855;
# NG3 Advanced Q1090; NG4 Advanced Q1295; NG5 Supreme Q1520.
# Legacy quality_per_level, first_level and max_level values in existing
# server configs are ignored; they no longer cap the scaled level.
tier_families:
  sharpness:
    enabled: true # false -> keep ordinary sharpness ValhallaMMO scaling, no tiers
    base: minecraft:sharpness
    required_perks:
      - enchanting_perk_sharpnesses
    tiers:
      - enchantment: enchantssquared:lesser_sharpness
        progression:
          - required_ng: 1
            quality_at_first_level: 650
          - required_ng: 2
            quality_at_first_level: 855
      - enchantment: enchantssquared:advanced_sharpness
        progression:
          - required_ng: 3
            quality_at_first_level: 1090
          - required_ng: 4
            quality_at_first_level: 1295
      - enchantment: enchantssquared:supreme_sharpness
        progression:
          - required_ng: 5
            quality_at_first_level: 1520
