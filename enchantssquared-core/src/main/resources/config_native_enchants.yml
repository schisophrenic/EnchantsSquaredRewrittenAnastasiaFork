# Edit this file to declare NEW REAL Minecraft enchantments.
# Paper registers these enchantments DIRECTLY during Java plugin bootstrap.
# No datapack is written to your world. Restart after editing this file,
# because Minecraft's enchantment registry freezes before onEnable().
#
# Native registry entries are global. The enchantment table's tier replacements
# are PLAYER-SPECIFIC, based on their ValhallaMMO perks and enchanting quality.
#
# Java effect handlers (implemented by the plugin):
#   vanilla_sharpness: Java damage +0.5 * (level + 1) on melee hit
#   vanilla_smite: Java damage +2.5 * level ONLY vs undead
#   vanilla_bane_of_arthropods: +2.5 * level vs arthropods + Slowness IV
#   on_hit_potion: special effect with configured potion and chance
#   none: registry-only until you implement a Java handler
#
# More event handlers can be added without changing how enchantments are registered.
# Cosmetic aliases: only names change. Existing PDC IDs/Java behavior stay intact.
display_aliases:
  vampiric: Life Steal
  sapping: Adept
  vitality: Strengthened Vitality
  sunforged: Smelter
  lava_walker: Lava Walker
  pulling: Dragging
  piercer: Penetrating Edge
  shielding: Natural Blocking

# Hard-disabled legacy spells. Other existing enchants are unchanged.
blocked_base_enchants: [damage_reduction]

# Naturally dropped armor/tools/utility loot: no Smithing skill required.
# Uses ValhallaMMO's real SmithingItemPropertyManager quality and attribute
# APIs (NOT an invented lore tag). It does not call ValhallaEquipment's
# crafting-only class/model randomizer. Test separately with that plugin.
loot_equipment:
  enabled: true
  quality_fraction_min: 0.55  # 55% of the material neutral quality
  quality_fraction_max: 0.80  # 80% of neutral; deliberately LOW quality
  item_pool:
    - IRON_HELMET
    - IRON_CHESTPLATE
    - IRON_LEGGINGS
    - IRON_BOOTS
    - DIAMOND_CHESTPLATE
    - IRON_SWORD
    - IRON_PICKAXE
    - DIAMOND_PICKAXE
    - BOW
    - SHIELD
    - FISHING_ROD
  # ValhallaMMO premium item attributes. Copied and rolled on the loot.
  attribute_pool:
    - CRIT_CHANCE
    - CRIT_DAMAGE
    - STUN_CHANCE
    - LIFE_STEAL
    - FIRE_RESISTANCE
    - MAGIC_RESISTANCE
    - BLEED_CHANCE
    - DURABILITY_MULTIPLIER
    - ENTITY_DROPS
  max_random_attributes: 2
  attribute_min: 0.01
  attribute_max: 0.05
  # Chance PER loot event to add one low-quality equipment item.
  acquisition:
    structure_chest: 0.10
    fishing: 0.025
    mob_drop: 0.007


settings:
  # Existing EnchantsSquared PDC effects remain enabled independently.
  # Only this enchantments: section is registered as new native entries.
  maximum_bonus_enchantments: 1
  # Per-family switch: tier_families.<family>.enabled: false
  # Keeps vanilla base enchanting + ValhallaMMO amplification; leaves the
  # Paper tier registry entries dormant so previously enchanted gear still works.
  # Magic Protection reduces elemental hits by 3% per level per armor piece.
  # The sum of all protection enchantment-based mitigation stays <90% (max 85%).
  magic_protection_percent_per_level: 0.03
  magic_protection_max_reduction: 0.85

